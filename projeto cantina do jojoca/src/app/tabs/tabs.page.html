<ion-header>
  <ion-toolbar>
    <ion-title>Achados e Perdidos</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="cardapio">
      <ion-icon name="search-outline"></ion-icon>
      <ion-label>Achados</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="comanda">
      <ion-icon name="alert-circle-outline"></ion-icon>
      <ion-label>Perdidos</ion-label>
      @if (comanda.itensPerdidos().length > 0) {
        <ion-badge color="danger">{{ comanda.itensPerdidos().length }}</ion-badge>
      }
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
