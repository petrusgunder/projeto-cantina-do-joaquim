<ion-content class="ion-padding">

  <ion-segment [value]="filtro" (ionChange)="mudarFiltro($event)" class="filtro-segmento">
    <ion-segment-button value="todos">
      <ion-label>Todos</ion-label>
    </ion-segment-button>
    <ion-segment-button value="bebida">
      <ion-label>Bebidas</ion-label>
    </ion-segment-button>
    <ion-segment-button value="comida">
      <ion-label>Comidas</ion-label>
    </ion-segment-button>
  </ion-segment>

  <div class="cardapio-grid">
    @for (item of itensFiltrados; track item.nome) {
      <ion-card class="item-cardapio">
        <div class="item-foto" [style.background-image]="'url(' + item.foto + ')'"></div>
        <ion-card-content>
          <ion-badge class="item-categoria">{{ rotuloCategoria(item.categoria) }}</ion-badge>
          <div class="item-nome">{{ item.nome }}</div>
          <div class="item-preco">R$ {{ item.preco.toFixed(2) }}</div>
          <ion-button size="small" expand="block" (click)="colocarNaComanda(item)">
            Colocar na comanda
          </ion-button>
        </ion-card-content>
      </ion-card>
    }
  </div>

</ion-content>
