<ion-content class="ion-padding">

  <div class="login-wrap">

    <div class="login-marca">
      <div class="login-logo">CJ</div>
      <h1>Criar conta</h1>
      <p>Cadastro com e-mail e senha para pedir na Cantina do Joaquim</p>
    </div>

    <ion-card>
      <ion-card-content>

        <ion-item lines="none">
          <ion-label position="stacked">E-mail</ion-label>
          <ion-input
            type="email"
            [(ngModel)]="email"
            placeholder="ex: aluno@ifsc.edu.br">
          </ion-input>
        </ion-item>

        <ion-item lines="none">
          <ion-label position="stacked">Senha</ion-label>
          <ion-input
            type="password"
            [(ngModel)]="senha"
            placeholder="Mínimo de 6 caracteres">
          </ion-input>
        </ion-item>

        @if (mensagemErro) {
          <p class="msg-erro">
            {{ mensagemErro }}
          </p>
        }

        <ion-button expand="block" (click)="cadastrar()">
          Cadastrar
        </ion-button>

        <ion-button expand="block" fill="clear" routerLink="/login">
          Já tenho conta
        </ion-button>

      </ion-card-content>
    </ion-card>

  </div>

</ion-content>
